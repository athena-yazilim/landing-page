<style>
  :root {
    --navy: #12203A; --navy-light: #1B2E52;
    --bronze: #D9A441; --bronze-dark: #B8892E; --bronze-text: #8C6A23;
    --text-secondary: #4A5568; --text-secondary-dark: #B8C2D3;
    --white: #FFFFFF; --gray-50: #F3F4F6;
    --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --max: 1120px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { font: 500 16px/26px var(--font); color: var(--navy); background: var(--white); }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: var(--white); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 24px; }
  .logo svg { display: block; height: 40px; width: auto; }
  nav ul { display: flex; gap: 32px; list-style: none; }
  nav a { text-decoration: none; font: 700 14px/22px var(--font); color: var(--navy); }
  nav a:hover { color: var(--bronze-text); }
  .actions { display: flex; align-items: center; gap: 16px; }
  .lang { display: inline-flex; border: 1px solid var(--navy); border-radius: 999px; overflow: hidden; }
  .lang button { font: 700 12px/16px var(--font); letter-spacing: 0.1em; padding: 6px 12px; border: 0; background: transparent; color: var(--navy); cursor: pointer; }
  .lang button[aria-pressed="false"]:hover { background: var(--gray-50); }
  .lang button[aria-pressed="true"] { background: var(--navy); color: var(--white); }
  .btn { display: inline-block; font: 700 16px/24px var(--font); text-decoration: none; padding: 12px 24px; border-radius: 8px; }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-accent { background: var(--bronze); color: var(--navy); }
  .btn-accent:hover { background: var(--bronze-dark); }
  .btn-ghost { border: 1px solid var(--text-secondary-dark); color: var(--white); }
  .btn-ghost:hover { background: var(--navy-light); }
  .btn-sm { font-size: 14px; padding: 8px 16px; }
  :focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .hero :focus-visible, .contact :focus-visible, footer :focus-visible { outline-color: var(--bronze); }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: var(--navy); color: var(--white); padding: 120px 0 128px; }
  .hero .deco { position: absolute; pointer-events: none; }
  .overline { font: 700 12px/16px var(--font); letter-spacing: 0.2em; text-transform: uppercase; }
  .hero .overline { color: var(--bronze); }
  .hero h1 { font: 800 48px/56px var(--font); letter-spacing: -0.01em; margin: 16px 0 24px; max-width: 14ch; }
  .hero p { font-size: 18px; line-height: 28px; color: var(--text-secondary-dark); max-width: 60ch; }
  .hero .cta { display: flex; gap: 16px; margin-top: 40px; flex-wrap: wrap; }

  /* Sections */
  section { padding: 96px 0; }
  .alt { background: var(--gray-50); }
  .sec-head { max-width: 640px; margin-bottom: 48px; }
  .sec-head .overline { color: var(--bronze-text); }
  h2 { font: 700 32px/40px var(--font); margin-top: 12px; }
  .sec-head p { color: var(--text-secondary); margin-top: 16px; }
  .grid { display: grid; gap: 24px; grid-template-columns: repeat(3, 1fr); }
  .card { background: var(--gray-50); border-radius: 12px; padding: 32px; }
  .alt .card { background: var(--white); }
  .card .num { font: 800 20px/28px var(--font); color: var(--bronze-text); }
  h3 { font: 700 20px/28px var(--font); margin: 16px 0 8px; }
  .card p { color: var(--text-secondary); }
  .steps { counter-reset: s; }
  .steps .card { border-top: 3px solid var(--navy); }
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .about p + p { margin-top: 16px; }
  .about .body p { color: var(--text-secondary); }
  .todo { display: inline-block; font: 700 12px/16px var(--font); color: var(--bronze-text); border: 1px dashed var(--bronze-dark); border-radius: 4px; padding: 2px 8px; margin-top: 16px; }

  /* Contact */
  .contact { background: var(--navy); color: var(--white); text-align: center; position: relative; overflow: hidden; }
  .contact .overline { color: var(--bronze); }
  .contact h2 { margin: 12px auto 16px; max-width: 20ch; }
  .contact p { color: var(--text-secondary-dark); max-width: 56ch; margin: 0 auto; }
  .contact .mail { display: inline-block; margin-top: 32px; font: 700 20px/28px var(--font); color: var(--bronze); text-decoration: none; }
  .contact .mail:hover { text-decoration: underline; }
  .contact .cta { margin-top: 24px; }

  /* Footer */
  footer { background: var(--navy-light); color: var(--text-secondary-dark); font-size: 14px; line-height: 22px; padding: 40px 0; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .foot svg { display: block; height: 36px; width: auto; }
  .foot nav ul { gap: 8px 24px; flex-wrap: wrap; }
  .foot nav a { color: var(--text-secondary-dark); font-weight: 500; }
  .foot nav a:hover { color: var(--white); }

  /* Mobile */
  .menu-btn { display: none; background: none; border: 0; padding: 8px; cursor: pointer; }
  .menu-btn span { display: block; width: 22px; height: 2px; background: var(--navy); margin: 5px 0; }
  @media (max-width: 860px) {
    .main-nav, .actions .btn { display: none; }
    .menu-btn { display: block; }
    .main-nav.open { display: block; position: absolute; top: 72px; left: 0; right: 0; background: var(--white); padding: 8px 24px 24px; }
    .main-nav.open ul { flex-direction: column; gap: 0; }
    .main-nav.open a { display: block; padding: 12px 0; font-size: 16px; }
    .logo svg { height: 36px; }
    .hero { padding: 72px 0 80px; }
    .hero h1 { font-size: 40px; line-height: 48px; }
    section { padding: 64px 0; }
    .grid, .about { grid-template-columns: 1fr; }
    .about { gap: 24px; }
    .card { padding: 24px; }
    .hero .cta .btn { width: 100%; text-align: center; }
    .foot { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  const menuBtn = document.querySelector('.menu-btn'), nav = document.getElementById('main-nav');
  menuBtn.addEventListener('click', () => { const o = nav.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); });
  nav.addEventListener('click', e => { if (e.target.tagName === 'A') { nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); } });
  document.getElementById('year').textContent = new Date().getFullYear();
  setLang(location.hash === '#en' ? 'en' : 'tr');
</script>
</body>
</html>
